<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dear Me | Your Online Diary</title>

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>

    <div class="page">


        <!-- =========================
             LEFT SIDE
        ========================== -->

        <section class="hero">


            <!-- Logo -->

            <div class="logo">

              <!-- 
                <img
                    src="NOTHSTAR LOGO.png"
                    alt="Dear Me logo">

                <span>DEAR ME</span>
-->
            </div>


            <!-- Main Hero Content -->

            <div class="hero-content">
<!--
    <h1>
        Your thoughts.<br>
        Your story.
    </h1>
  -->
    <p class="hero-text">
        A private space to write, reflect,
        remember, and simply be yourself.
    </p>

</div>


        </section>



        <!-- =========================
             RIGHT SIDE
        ========================== -->

        <main class="login">

            <div class="login-container">


                <!-- Header -->

                <h2>
                    Welcome
                </h2>

                <p class="subtitle">
                  Your thoughts.<br>
                  Your story.
                  <br>
                  Your diary is waiting for you.
                </p>



                <!-- Login Form -->

                <form
                    action="#"
                    method="post"
                >


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email address
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>



                    <!-- Password -->

                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            minlength="8"
                            required
                        >

                    </div>



                    <!-- Remember / Forgot -->

                    <div class="options">


                        <label class="remember">

                            <input
                                name="remember"
                                type="checkbox"
                            >

                            <span>
                                Keep me signed in
                            </span>

                        </label>


                        <a href="#forgot-password">
                            Forgot password?
                        </a>


                    </div>



                    <!-- Login -->

                    <button
                        class="signin-btn"
                        type="submit"
                    >
                        Open my diary
                    </button>


                </form>



                <!-- Divider -->

                <div class="divider">

                    <span>
                        Or continue with
                    </span>

                </div>



                <!-- Google -->

                <button
                    class="google-btn"
                    type="button"
                >

                    <span class="google-icon">
                        G
                    </span>

                    Continue with Google

                </button>



                <!-- Create Account -->

                <p class="signup">

                    Don't have a diary yet?

                    <a href="#create-account">
                        Start writing
                    </a>

                </p>


            </div>

        </main>


    </div>

</body>

</html>
